<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sonar Cone Radius</title>
    <!-- Changed by: Jack Carrel, 02-May-2026 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/sonar-cone/styles.css">
    <link rel="manifest" href="/sonar-cone/manifest.json">

    <meta name="theme-color" content="#007aff">
    <link rel="apple-touch-icon" href="/sonar-cone/icons/icon-192.png">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>

<body>
  <div id="appContainer">

    <div id="controls">

      <!-- Angle Presets -->
      <div class="row">
        <label>Angle:</label>
        <label><input type="radio" name="anglePreset" value="15" checked> 15°</label>
        <label><input type="radio" name="anglePreset" value="45"> 45°</label>
      </div>

      <!-- Bottom Depth -->
      <div class="row">
        <label for="bottomDepth">Bottom:</label>
        <input type="range" id="bottomDepth" min="1" max="300" value="30">
        <input type="number" id="bottomDepthNumber" min="1" max="300" value="30">
      </div>

      <!-- Fish Depth -->
      <div class="row">
        <label for="fishDepth">Fish:</label>
        <input type="range" id="fishDepth" min="1" max="300" value="12">
        <input type="number" id="fishDepthNumber" min="1" max="300" value="12">
      </div>

      <!-- Diagram Mode -->
      <div class="row">
        <label for="diagramMode">Mode:</label>
        <select id="diagramMode">
          <option value="simple">Simple</option>
          <option value="enhanced" selected>Enhanced</option>
        </select>
      </div>

      <!-- Radius Readouts -->
      <div class="row">
        <label>Bottom Radius:</label>
        <span id="bottomRadiusValue">0 ft</span>
      </div>

      <div class="row">
        <label>Fish Radius:</label>
        <span id="fishRadiusValue">0 ft</span>
      </div>

      <!-- Info Button -->
      <div class="row">
        <button id="infoButton">Info</button>
      </div>

    </div>

    <canvas id="coneCanvas"></canvas>

  </div>

  <!-- Info Overlay -->
  <div id="infoOverlay" class="hidden">
    <div id="infoBox">
      <h2>About This App</h2>
      <p>This sonar cone visualizer shows cone width, fish radius, and depth relationships.</p>
      <button id="closeInfoButton">Close</button>
    </div>
  </div>

  <script src="app.js?v=1000"></script>
</body>


</html>
