<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sonar Cone Radius</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/sonar-cone/styles.css">
    <link rel="manifest" href="/sonar-cone/manifest.json">

    <meta name="theme-color" content="#007aff">
    <link rel="apple-touch-icon" href="/sonar-cone/icons/icon-192.png">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>

<body>
  <div id="appContainer">

    <!-- Header with Info Button -->
    <div class="app-header">
      <h1>Sonar Cone</h1>
      <button id="infoButton" class="icon-button">ℹ️</button>
    </div>

    <div id="controls">

      <!-- Garmin Angle Presets -->
      <div class="card angle-card">
        <h3 class="section-title">Sonar Cone Angle</h3>

        <div class="preset-group">

          <label class="preset-option garmin-wide">
            <input type="radio" name="anglePreset" value="45">
            <div class="preset-title">Wide</div>
            <div class="preset-sub">77 kHz · 45°</div>
          </label>

          <label class="preset-option garmin-narrow">
            <input type="radio" name="anglePreset" value="15" checked>
            <div class="preset-title">Narrow</div>
            <div class="preset-sub">200 kHz · 15°</div>
          </label>

        </div>
      </div>

      <!-- Bottom Depth -->
      <div class="card">
        <h3 class="section-title">Bottom Depth</h3>
        <div class="depth-input-row">
          <input type="range" id="bottomDepth" min="1" max="300" value="30">
          <input type="number" id="bottomDepthNumber" min="1" max="300" value="30">
        </div>
      </div>

      <!-- Fish Depth -->
      <div class="card">
        <h3 class="section-title">Fish Depth</h3>
        <div class="depth-input-row">
          <input type="range" id="fishDepth" min="1" max="300" value="12">
          <input type="number" id="fishDepthNumber" min="1" max="300" value="12">
        </div>
      </div>

      <!-- Diagram Mode (Compact Single Row) -->
      <div class="card diagram-card">
        <div class="diagram-row">
          <label for="diagramMode">Diagram Mode:</label>
          <select id="diagramMode">
            <option value="simple">Simple</option>
            <option value="enhanced" selected>Enhanced</option>
          </select>
        </div>
      </div>

      <!-- Radius Outputs -->
<div class="card radius-card compact-radius">
  <div class="radius-row">
    <div class="radius-item">
      <span class="radius-name">Bottom Radius:</span>
      <span class="radius-value" id="bottomRadiusValue">0 ft</span>
    </div>

    <div class="radius-item">
      <span class="radius-name">Fish Radius:</span>
      <span class="radius-value" id="fishRadiusValue">0 ft</span>
    </div>
  </div>
</div>




    </div>

    <canvas id="coneCanvas"></canvas>

  </div>

  <!-- Info Overlay -->
  <div id="infoOverlay" class="hidden">
    <div id="infoBox">
      <h2>About This App</h2>
      <p>This sonar cone visualizer shows cone width, fish radius, and depth relationships.</p>
      <button id="closeInfoButton">Close</button>
    </div>
  </div>

  <script src="app.js?v=1000"></script>
</body>
</html>
