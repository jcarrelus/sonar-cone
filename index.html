<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sonar Cone Radius</title>
    <!-- Changed by: Jack Carrel, 02-May-2026 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/sonar-cone/styles.css">
    <link rel="manifest" href="/sonar-cone/manifest.json">

    <meta name="theme-color" content="#007aff">
    <link rel="apple-touch-icon" href="/sonar-cone/icons/icon-192.png">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>

<body>
    <div id="appContainer">

        <div id="controls">
            <div class="row">
                <button id="angle15">15°</button>
                <button id="angle45">45°</button>
            </div>

            <div class="row">
                <label for="customAngle">Custom Angle:</label>
                <input type="number" id="customAngle" min="1" max="90" step="0.1" placeholder="°">
                <button id="applyCustomAngle">Apply</button>
            </div>

            <div class="row">
                <label for="bottomDepth">Bottom Depth (ft):</label>
                <input type="number" id="bottomDepth" min="1" max="300" step="1">
            </div>

            <div class="row">
                <label for="fishDepth">Fish Depth (ft):</label>
                <input type="number" id="fishDepth" min="1" max="300" step="1">
            </div>
        </div>

        <canvas id="coneCanvas"></canvas>

    </div>

    <script src="app.js?v=999"></script>
</body>

</html>
